<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeBD — Find Every Coding Competition in Bangladesh In One Place</title>
  <meta name="description" content="CodeBD is Bangladesh's premier centralized hub for discovering CSE coding competitions, ICPC regionals, IUPC tournaments, university hackathons, and programming contests." />
  <meta name="keywords" content="CodeBD, Bangladesh Coding Competition, BUET IUPC, ICPC Dhaka Regional, DU Hackathon, SUST Programming Contest, KUET CP, Bangladeshi CSE Students" />
  
  <!-- Open Graph / Social -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="CodeBD — Bangladesh's Competitive Programming Hub" />
  <meta property="og:description" content="Discover programming contests, hackathons, ICPC events, and CSE challenges happening across Bangladesh." />
  <meta property="og:site_name" content="CodeBD" />
  <meta name="theme-color" content="#07090e" />

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇧🇩</text></svg>">

  <!-- Google Fonts: Plus Jakarta Sans, Outfit, Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#07090e',
              card: '#0d1322',
              cyan: '#06b6d4',
              blue: '#3b82f6',
              purple: '#8b5cf6',
              bdGreen: '#006a4e',
              bdRed: '#f42a41',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['"Outfit"', 'sans-serif'],
            mono: ['"Fira Code"', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React 18 & ReactDOM & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-[#07090e] text-slate-100 antialiased selection:bg-cyan-500 selection:text-black">
  <div id="root"></div>

  <!-- Data and Application Script -->
  <script src="data.js"></script>
  <script type="text/babel" src="app.js"></script>

  <!-- Initialize Lucide icons helper -->
  <script>
    window.addEventListener('load', () => {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    });
  </script>
</body>
</html>
